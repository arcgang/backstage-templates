apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nodejs-service
  title: Node.js Service (Express + k8s)
  description: |
    Express service with Dockerfile, Kubernetes manifests for Rancher Desktop
    (k3s + Traefik ingress), TechDocs and a GitHub Actions build workflow.
  tags:
    - nodejs
    - express
    - kubernetes
    - recommended
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Service details
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component (lowercase, dashes)
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this service do?
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        system:
          title: System
          type: string
          description: System this component belongs to
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            allowArbitraryValues: true

    - title: Runtime configuration
      properties:
        port:
          title: HTTP port
          type: number
          default: 8080
        replicas:
          title: Kubernetes replicas
          type: number
          default: 1
        hostname:
          title: Ingress hostname
          type: string
          description: Traefik will route this host to the service
          default: my-service.localhost

    - title: Destination
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        # skeleton files use ${{ }} too, so escape the k8s/gh-actions literals
        # by keeping them out of templated files where needed.
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          hostname: ${{ parameters.hostname }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
    text:
      - title: Deploy to Rancher Desktop
        content: |
          ```sh
          docker build -t ${{ parameters.name }}:dev .
          kubectl --context rancher-desktop apply -f k8s/
          curl http://${{ parameters.hostname }}
          ```
